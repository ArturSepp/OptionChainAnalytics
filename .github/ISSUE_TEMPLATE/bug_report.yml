name: Bug report
description: Report reproducible incorrect behavior in OCA.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach credentials, proprietary/licensed market data, or personal information.
        Security concerns must use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: OCA version or commit
      placeholder: 2.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: Python 3.10.14 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use simulated or redacted data and include imports and inputs.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and traceback
      render: shell
    validations:
      required: true
  - type: textarea
    id: conventions
    attributes:
      label: Relevant data conventions
      description: Include timezone, provider, units, multiplier, spot/forward, and missing-data behavior when applicable.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data and security check
      options:
        - label: I removed credentials, private/licensed data, and personal information.
          required: true
