name: Feature request
description: Propose a focused addition within OCA's option-chain data boundary.
title: "[Feature]: "
body:
  - type: textarea
    id: research_task
    attributes:
      label: Research or user task
      description: Describe the task before proposing an API.
    validations:
      required: true
  - type: textarea
    id: current_gap
    attributes:
      label: Current limitation
      description: Explain why the public API and documented adapters do not already handle it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include schema, point-in-time, units, timezone, missing-data, and provider/licensing implications.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Data container or schema
        - Point-in-time reconstruction
        - Query or maturity roll
        - Provider adapter
        - Documentation or example
        - Packaging or developer tooling
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundary
      options:
        - label: This does not require committing or redistributing proprietary/licensed data.
          required: true
        - label: I considered whether the functionality belongs in vanilla-option-pricers, qis, bbg-fetch, or a strategy repository.
          required: true
