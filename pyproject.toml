[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "option-chain-analytics"
version = "5.2.0"
description = "Point-in-time option-chain containers, feed normalisation, reconstruction, and queries for quantitative research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
maintainers = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
requires-python = ">=3.10"
keywords = [
    "option chains",
    "options data",
    "implied volatility",
    "volatility surface",
    "quantitative finance",
    "point-in-time data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "matplotlib>=3.8.0",
    "numba>=0.63.0",
    "numpy>=2.0",
    "pandas>=2.2.0",
    "qis>=5.11.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "vanilla-option-pricers>=1.3.0",
]

[project.optional-dependencies]
cboe = [
    "pyarrow>=14.0.0",
]
deribit = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

bloomberg = [
    "bbg-fetch>=2.3.0",
]
thetadata = [
    "python-dotenv>=1.0; python_version >= '3.12'",
    "thetadata>=1.0.9; python_version >= '3.12'",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.0",
]
all = [
    "bbg-fetch>=2.3.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0; python_version >= '3.12'",
    "requests>=2.31.0",
    "sphinx>=8.0",
    "tqdm>=4.66.0",
    "thetadata>=1.0.9; python_version >= '3.12'",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
lint = ["ruff>=0.9.0"]

[project.urls]
Homepage = "https://github.com/ArturSepp/OptionChainAnalytics"
Documentation = "https://optionchainanalytics.readthedocs.io/en/latest/"
Repository = "https://github.com/ArturSepp/OptionChainAnalytics"
Issues = "https://github.com/ArturSepp/OptionChainAnalytics/issues"
Changelog = "https://github.com/ArturSepp/OptionChainAnalytics/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["option_chain_analytics*"]
exclude = [
    "tests*",
    "option_chain_analytics.run_local*",
    "option_chain_analytics.*.run_local*",
    "option_chain_analytics.*.*.run_local*",
    "option_chain_analytics.*.*.*.run_local*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-select = ["TID251", "TID253", "ICN"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A1: OCA depends on qis and vanilla-option-pricers; bbg-fetch is an optional provider integration.
"optimalportfolios".msg = "A1: subject packages never import each other."
"factorlasso".msg = "A1: subject packages never import each other."
"trendfollowing".msg = "A1: subject packages never import each other."
"privateassets".msg = "A1: subject packages never import each other."
"stochvolmodels".msg = "A1: subject packages never import each other."
"goal_based_allocation".msg = "A1: subject packages never import each other."

[tool.ruff.lint.flake8-tidy-imports]
# A3: optional libraries stay behind guarded local imports, never package import time.
banned-module-level-imports = [
    "yfinance",
    "pandas_datareader",
    "pybloqs",
    "plotly",
    "pyarrow",
    "psycopg2",
    "sqlalchemy",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# This replaces Ruff's default alias map; only numpy and pandas use house aliases.
numpy = "np"
pandas = "pd"

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401"]
# These narrow waivers preserve pre-existing numerical and provider behavior.
# New modules, the public example, and tests receive no blanket exemptions.
"src/option_chain_analytics/option_chain.py" = ["E712", "E741", "F841"]
"src/option_chain_analytics/visuals/plots.py" = ["E741"]
